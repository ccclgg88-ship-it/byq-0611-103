services:
  web:
    image: nginx:alpine
    container_name: lotus-meditation
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - lotus-net

networks:
  lotus-net:
    driver: bridge
